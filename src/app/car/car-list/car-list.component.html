<div class="container-fluid mt-4">
    <div class="mb-3">
        <div class="brand-badge">TuSegundazo.com</div>
    </div>

    
    <div class="row justify-content-center mb-3">
        <div class="col-10">
            <img src="assets/Frame 6.png" alt="Car Banner" class="img-fluid w-100 rounded shadow-sm" />
        </div>
    </div>

    
    <div class="row justify-content-center mb-4">
        <div class="col-10 text-center bg-primary text-white py-2 rounded">
            <h5 class="m-0 text-uppercase">
                Comercialización de automotores nuevos y usados
            </h5>
        </div>
    </div>

   
    <div class="row justify-content-center">
        <div class="col-10">
            <table class="table table-striped table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Marca</th>
                        <th>Línea</th>
                        <th>Modelo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let car of cars; let i = index">
                        <td>{{ i + 1 }}</td>
                        <td>{{ car.marca }}</td>
                        <td>{{ car.linea }}</td>
                        <td>{{ car.modelo }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    
    <div class="row justify-content-center mt-4">
        <div class="col-10 text-center text-muted small">
            <p class="m-0">
                {{"Contact us: +57 3102105253 - info@tusegundazo.com - @tusegundazo"}}
            </p>
        </div>
    </div>
</div>
